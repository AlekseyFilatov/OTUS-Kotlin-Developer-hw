#  application.yaml работает в jvm и native, но не работает в режиме сервлета с Tomcat
# в этом случае необходимо сформировать application.conf

ktor:
  development: true
  deployment:
    port: 8080
  watch:
    - classes
    - resources
  application:
    modules:
      - "api.kotlinproject.app.ktor.ApplicationJvmKt.moduleJvm"
  urls:
    - "http://127.0.0.1:8080/v1"
    - "http://0.0.0.0:8080/v1"
    - "http://192.168.0.182:8080/v1"

  logger: "$MDLMLS_LOGGER:logback"
#  # Логирование типа socket требует установки в fluent-bit.conf
#  # [INPUT]
#  # Name    TCP # Вот здесь нужно поменять!
#  # Listen  0.0.0.0
#  # Port    24224
#  logger: socket
#  socketLogger:
#    port: 24224

mlservice:
  repository:
    test: "inmemory"
    prod: "$DB_TYPE_PROD:inmemory"
    cassandra:
      keyspace: "$MDLMLS_KEYSPACE:mlservice-mls"
      host: "$MDLMLS_HOST:localhost"
      port: "$MDLMLS_PORT:9042"
      user: "$MDLMLS_USER:cassandra"
      pass: "$MDLMLS_PASS:cassandra"
