openapi: 3.0.4
info:
  title: Marketplace log models
  description: Log models for logging services of marketplace
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
paths: {}

components:
  schemas:
    CommonLogModel:
      title: Общая модель лога
      description: Общая модель лога для всех микросервисов системы
      type: object
      properties:
        messageTime:
          type: string
        logId:
          type: string
        source:
          type: string
        ml:
          $ref: '#/components/schemas/MdlLogModel'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorLogModel'

    MdlLogModel:
      title: Модель лога
      type: object
      properties:
        requestTitle:
          type: string
        operation:
          $ref: '#/components/schemas/MdlLogOperation'
        requestMl:
          $ref: '#/components/schemas/MlLog'
        requestFilter:
          $ref: '#/components/schemas/MlFilterLog'
        responseMl:
          $ref: '#/components/schemas/MlLog'
        responseMls:
          type: array
          items:
            $ref: '#/components/schemas/MlLog'

    MdlLogOperation:
      type: string
      enum:
        - create
        - read
        - update
        - delete
        - search
        - init
        - finish

    ErrorLogModel:
      title: Модель лога для ошибки
      type: object
      properties:
        message:
          type: string
        field:
          type: string
        code:
          type: string
        level:
          type: string

    MlLog:
      title: Модель лога
      type: object
      properties:
        title:
          type: string
        description:
          type: string

    MlFilterLog:
      title: Модель лога фильтра
      properties:
        searchString:
          type: string

